# 只使用已有镜像（推荐：先把 tar 导入，再启动本项目）
#
#   docker load -i ogame-vue-ts.tar
#   docker compose -f docker-compose.image.yml up -d
#
# 这个文件里**没有 build 段**，所以 docker 不会去 Docker Hub 拉取同名镜像。

services:
  ogame:
    image: ogame-vue-ts:latest
    container_name: ogame
    restart: unless-stopped
    ports:
      - "${OGAME_PORT:-25122}:25122"
    volumes:
      - ./data:/app/data
    environment:
      PORT: "25122"
      GAME_SPEED: "1"
      NPC_COUNT: "200"
      VISIBILITY: "public"
      LOCALE: "zh-CN"
      NEWBIE_PROTECTION_HOURS: "24"
      MAX_ACCOUNT: ""
      TICK_MS: "1000"
      AUTOSAVE_MS: "30000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:25122/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
