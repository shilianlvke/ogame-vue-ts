# 从源码构建并启动（需要完整项目目录，包含 Dockerfile）
#
#   docker compose -f docker-compose.build.yml up -d --build
#
# 前置条件：
#   1. 当前目录必须有 Dockerfile、package.json、pnpm-lock.yaml、src/、server/、scripts/
#   2. 基础镜像 node:22-alpine 能拉取到（国内建议配置镜像加速，见 doc/DEPLOY_DOCKER.md）

services:
  noskyman:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 国内可改成 https://registry.npmmirror.com
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: noskyman:latest
    container_name: noskyman
    restart: unless-stopped
    ports:
      - "${OGAME_PORT:-25122}:25122"
    volumes:
      - ./data:/app/data
    environment:
      PORT: "25122"
      GAME_SPEED: "1"
      NPC_COUNT: "200"
      VISIBILITY: "public"
      LOCALE: "zh-CN"
      NEWBIE_PROTECTION_HOURS: "24"
      MAX_ACCOUNT: ""
      TICK_MS: "1000"
      AUTOSAVE_MS: "30000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:25122/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
