# 默认入口：只使用本地已有镜像（不会联网拉取）
#
# 完整流程：
#   1. 在电脑（或能联网的机器）上构建并导出：
#        docker build -t ogame-vue-ts:latest .
#        docker save ogame-vue-ts:latest -o ogame-vue-ts.tar
#   2. 把 tar + 本文件 + docker-compose.yml 上传到 NAS 同一目录
#   3. NAS 上执行：
#        docker load -i ogame-vue-ts.tar
#        docker compose up -d
#
# 想从源码构建请改用：
#        docker compose -f docker-compose.build.yml up -d --build

services:
  noskyman:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: noskyman:latest
    container_name: noskyman
    restart: unless-stopped
    ports:
      - "${OGAME_PORT:-25122}:25122"
    volumes:
      - ./data:/app/data
    environment:
      PORT: "25122"
      GAME_SPEED: "10"
      NPC_COUNT: "200"
      VISIBILITY: "public"
      LOCALE: "zh-CN"
      NEWBIE_PROTECTION_HOURS: "24"
      MAX_ACCOUNT: ""
      TICK_MS: "1000"
      AUTOSAVE_MS: "30000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:25122/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
